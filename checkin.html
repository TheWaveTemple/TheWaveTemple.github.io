<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guest Check-In System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    /* ... [Keep all your existing CSS unchanged] ... */
    :root { --primary: #6CC9C3; --primary-dark: #5BB5AF; --secondary: #64748b; --light: #f8fafc; --dark: #0f172a; --border: #cbd5e1; --radius: 8px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    body { background: linear-gradient(135deg, #f1f5f9, #e2e8f0); color: var(--dark); padding: 20px; font-family: 'Segoe UI', sans-serif; }
    .container { max-width: 1000px; margin: 0 auto; }
    .hidden { display: none !important; }
    .header { text-align: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); }
    .header img { max-height: 70px; }
    .form-container { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .form-header { background: var(--primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    form { padding: 20px; }
    .form-section { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .form-section h3 { color: var(--primary); margin-bottom: 15px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .full-width { grid-column: 1 / -1; }
    label { font-weight: 500; font-size: 0.9rem; margin-bottom: 5px; }
    input, select { padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); }
    
    /* Signature Pad */
    .signature-container { border: 1px solid var(--border); background: #fcfcfc; padding: 10px; border-radius: var(--radius); }
    #signature-pad { width: 100%; height: 150px; background: white; border: 1px solid var(--border); touch-action: none; }
    
    .btn-primary { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: var(--radius); font-size: 1.1rem; cursor: pointer; }
    .btn-primary:disabled { background: var(--secondary); opacity: 0.7; }
    .uppercase { text-transform: uppercase; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 10px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://static.wixstatic.com/media/91a755_ebad918f50374773afafffd4990151d4~mv2.png/v1/crop/x_0,y_28,w_1322,h_325/fill/w_470,h_116,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/logo_pinzell_hor_Mesa%20de%20trabajo%201.png" alt="Hotel Logo">
    </div>
    
    <div class="form-container">
      <div class="form-header">
        <h2><i class="fas fa-user-check"></i> <span data-i18n="regTitle">Registration</span></h2>
        <select id="lang-switcher"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select>
      </div>
      
      <form id="checkin-form">
        <input type="hidden" name="contractDate" id="contractDate">

        <div class="form-section">
          <h3><i class="fas fa-user-circle"></i> <span data-i18n="personalInfo">Personal Information</span></h3>
          <div class="form-grid">
            <div class="form-group"><label data-i18n="fullName">Name</label><input type="text" name="name" required class="uppercase"></div>
            <div class="form-group"><label data-i18n="surname">First Surname</label><input type="text" name="surname1" required class="uppercase"></div>
            <div class="form-group"><label data-i18n="secondSurname">Second Surname</label><input type="text" name="surname2" class="uppercase"></div>
            <div class="form-group"><label data-i18n="nationality">Nationality</label><input type="text" name="nationality" list="iso-countries" placeholder="ESP" pattern="[A-Z]{3}" maxlength="3" required class="uppercase"></div>
            
            <div class="form-group"><label data-i18n="dob">Date of Birth</label>
              <input type="text" name="dob" class="date-picker" placeholder="dd/mm/yyyy" required>
            </div>
            
            <div class="form-group"><label data-i18n="gender">Gender</label><select name="gender" required><option value="">Select...</option><option value="M">Male</option><option value="F">Female</option></select></div>
          </div>
        </div>

        <div class="form-section">
          <h3><i class="fas fa-id-card"></i> <span data-i18n="docTitle">Documentation</span></h3>
          <div class="form-grid">
            <div class="form-group"><label data-i18n="documentType">Type</label>
              <select name="documentType" id="docTypeSelect" onchange="toggleSupportField()" required>
                <option value="PAS">Passport</option><option value="DNI">DNI(Spain)</option><option value="NIE">NIE(Spain)</option><option value="OTRO">Other</option>
              </select>
            </div>
            <div class="form-group"><label data-i18n="documentId">Number</label><input type="text" name="document" required class="uppercase"></div>
            <div class="form-group hidden" id="support-group"><label>Support Number</label><input type="text" name="supportNumber" id="supportNumber" class="uppercase"></div>
          </div>
        </div>

        <div class="form-section">
          <h3><i class="fas fa-home"></i> <span data-i18n="addressInfo">Address</span></h3>
          <div class="form-grid">
            <div class="form-group full-width"><label data-i18n="address">Address</label><input type="text" name="address" required></div>
            <div class="form-group"><label data-i18n="city">City</label><input type="text" name="city" required></div>
            <div class="form-group"><label data-i18n="postalCode">Postal Code</label><input type="text" name="postalCode" required></div>
            <div class="form-group"><label data-i18n="country">Country</label><input type="text" name="country" list="iso-countries" required class="uppercase"></div>
            <div class="form-group"><label data-i18n="email">Email</label><input type="email" name="email" required></div>
             <div class="form-group"><label data-i18n="phone">Phone</label><input type="tel" name="phone"></div>
          </div>
        </div>

        <div class="form-section">
          <h3><i class="fas fa-credit-card"></i> <span data-i18n="stayInfo">Stay & Payment</span></h3>
          <div class="form-grid">
            <div class="form-group"><label data-i18n="checkinDate">Check-in</label>
              <input type="text" name="checkinDate" class="date-picker" placeholder="dd/mm/yyyy" required>
            </div>
            <div class="form-group"><label data-i18n="checkoutDate">Check-out</label>
              <input type="text" name="checkoutDate" class="date-picker" placeholder="dd/mm/yyyy" required>
            </div>
            <div class="form-group"><label data-i18n="paymentType">Payment</label>
                <select name="paymentType" required>
                    <option value="PLATF" data-i18n="payPlatform">Booking/Airbnb/Online</option>
                    <option value="TARJT" data-i18n="payCard">Card</option>
                    <option value="EFECT" data-i18n="payCash">Cash</option>
                </select>
            </div>
          </div>
        </div>
        
        <div class="form-section">
          <h3><i class="fas fa-pen-nib"></i> <span data-i18n="signature">Signature</span></h3>
          <div class="signature-container">
            <canvas id="signature-pad"></canvas>
            <div style="text-align:right; margin-top:10px;"><button type="button" onclick="clearSignature()" data-i18n="clear">Clear</button></div>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn"><span id="btn-text" data-i18n="submit">Submit Registration</span><div id="btn-spinner" class="spinner hidden"></div></button>
      </form>
    </div>
  </div>

  <datalist id="iso-countries"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  
  <script>
    // --- CHANGE 1: Initialize Flatpickr ---
    // This allows manual typing (allowInput: true) and fixes the format to dd/mm/yyyy
    flatpickr(".date-picker", {
        dateFormat: "d/m/Y",
        allowInput: true,
        // Optional: disable mobile native picker to ensure format consistency
        disableMobile: "true" 
    });

    // [Keep your existing ISO Countries and Translations logic here...]
    const countryList = { "ESP":"Spain", "USA":"United States", "GBR":"United Kingdom", "FRA":"France", "DEU":"Germany" }; // (Shortened for brevity, keep your full list)
    const datalist = document.getElementById('iso-countries');
    Object.entries(countryList).forEach(([code, name]) => {
        const opt = document.createElement('option'); opt.value = code; opt.textContent = name; datalist.appendChild(opt);
    });
    
    // [Keep your existing Translations Logic]
    const translations = { en: { regTitle: "Registration", submit: "Submit Registration", clear: "Clear" } }; // (Shortened)
    
    // --- SIGNATURE LOGIC (Unchanged) ---
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    
    const resizeCanvas = () => {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      ctx.scale(ratio, ratio);
    };
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    const getCoordinates = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const start = (e) => { drawing = true; const {x,y} = getCoordinates(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); };
    const move = (e) => { if(!drawing) return; const {x,y} = getCoordinates(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); };
    const stop = () => { drawing = false; };
    
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', stop); canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', stop);

    function clearSignature() { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.beginPath(); }

    // --- CHANGE 2: NEW SUBMIT LOGIC ---
    document.getElementById('checkin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      const text = document.getElementById('btn-text');
      const spin = document.getElementById('btn-spinner');
      const form = e.target;
      
      btn.disabled = true; 
      spin.classList.remove('hidden'); 
      text.style.opacity = "0.5";
      
      try {
        const formData = new FormData(form);
        const object = {};
        formData.forEach((value, key) => object[key] = value);
        
        // Add signature to payload
        object.signature = canvas.toDataURL("image/png");
        
        // Add contract date if missing
        if(!object.contractDate) object.contractDate = new Date().toISOString().split('T')[0];

        // Send JSON to Google Apps Script
        const response = await fetch("https://script.google.com/macros/s/AKfycbwmnSIcC_Lx5LBbh-Z8VPdsLnhe-a6c2HXr9eNBDFNScEs5EyRQyLx4svxjPn61UKj7YA/exec", {
          method: "POST",
          body: JSON.stringify(object)
        });

        const result = await response.text();
        
        if (result.includes("Success")) {
          alert("Check-in successful! PDF sent to administration.");
          form.reset();
          clearSignature();
          document.getElementById('contractDate').value = new Date().toISOString().split('T')[0];
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          alert("Error: " + result);
        }

      } catch (error) {
        console.error(error);
        alert("Connection error: " + error.message);
      } finally {
        btn.disabled = false;
        spin.classList.add('hidden');
        text.style.opacity = "1";
      }
    });

    function toggleSupportField() {
        const type = document.getElementById('docTypeSelect').value;
        const group = document.getElementById('support-group');
        if (type === 'DNI' || type === 'NIE') group.classList.remove('hidden');
        else group.classList.add('hidden');
    }
  </script>
</body>
</html>
